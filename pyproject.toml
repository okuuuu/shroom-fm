[project]
name = "shroom-fm"
version = "0.1.0"
description = "Mushroom-foraging habitat scoring for Estonian forests"
authors = [
    { name = "okuu", email = "filipp.petuhhov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "owslib>=0.36.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
