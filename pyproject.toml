[project]
name = "shroom-fm"
version = "0.1.0"
description = "Mushroom-foraging habitat scoring for Estonian forests"
authors = [
    { name = "okuu", email = "filipp.petuhhov@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.1.4",
    "h5py>=3.16.0",
    "netcdf4>=1.7.4",
    "owslib>=0.36.0",
    "xarray>=2026.7.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
